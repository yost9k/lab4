services:
  postgres:
    image: postgres:16
    container_name: lab4-postgres
    environment:
      POSTGRES_DB: lab4
      POSTGRES_USER: lab4
      POSTGRES_PASSWORD: lab4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: lab4-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: lab4-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  sql-exporter:
    image: burningalchemist/sql_exporter:latest
    container_name: lab4-sql-exporter
    ports:
      - "9399:9399"
    volumes:
      - ./sql_exporter.yml:/config/sql_exporter.yml:ro
    command:
      - "-config.file=/config/sql_exporter.yml"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
