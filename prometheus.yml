global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: sql_exporter
    static_configs:
      - targets:
          - sql-exporter:9399

  - job_name: rocky_node_exporter
    static_configs:
      - targets:
          - 192.168.56.101:9100
